name: Dashboard publishing check (no booking)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/*dashboard*'
      - '.github/workflows/dashboard-check.yml'
      - 'src/main/java/com/prat/booking/BookingReport.java'
      - 'src/test/java/com/prat/booking/BookingReportTest.java'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate reports with mocked tests
        run: mvn -B -Dtest=BookingReportTest test
      - name: Validate publisher with fixtures
        run: python3 .github/scripts/test_publish_dashboard.py
      - name: Checkout public dashboard for dry-run
        uses: actions/checkout@v4
        with:
          repository: nicokiki/java-prat-booking-dashboard
          path: .dashboard
          persist-credentials: false
      - name: Validate Java report against dashboard archive without publishing
        run: python3 .github/scripts/publish_dashboard.py target/dashboard-fixture.json .dashboard --dry-run